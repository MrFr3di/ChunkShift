name: Conformance

# Persisted-contract gate: independent FastCDC, CSM and CSP checks, extended
# reader and apply fuzzing with differential decoders, JIT and NativeAOT
# consumers of both packed packages on x64 and ARM64, x64/ARM64 determinism
# and a larger-than-memory source. It is not a benchmark.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    # Every input that can change the built package, its NativeAOT behavior or
    # the independent vectors. Keep this list coarse: a narrow per-directory
    # list silently skips project files and build configuration.
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".editorconfig"
      - "*.slnx"
      - "docs/architecture/**"
      - ".github/workflows/conformance.yml"

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  native:
    name: native (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PACKAGE_VERSION: 0.0.0-conformance.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ChunkShift.slnx

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          dotnet build ChunkShift.slnx -c Release --no-restore
          dotnet test ChunkShift.slnx -c Release --no-build --no-restore

      - name: Verify the FastCDC vectors with the independent reference
        run: python3 tools/conformance/fastcdc_reference.py --verify

      - name: Verify the CSM vectors with the independent generator and decoder
        run: python3 tools/conformance/csm/generate.py --verify tests/ChunkShift.Tests/Fixtures/CsmV1

      - name: Extended CSM reader fuzz with differential decoder check
        shell: bash
        env:
          CHUNKSHIFT_FUZZ_ITERATIONS: 5000
          CHUNKSHIFT_FUZZ_DUMP: ${{ runner.temp }}/csm-fuzz
        run: |
          set -euo pipefail
          # Fresh seeds per run explore new inputs; any failure prints its seed
          # and iteration, so it replays with CHUNKSHIFT_FUZZ_SEEDS.
          base=$(( ${{ github.run_number }} * 16 ))
          export CHUNKSHIFT_FUZZ_SEEDS="$base,$((base + 1)),$((base + 2)),$((base + 3))"
          echo "fuzz seeds: $CHUNKSHIFT_FUZZ_SEEDS"
          dotnet test tests/ChunkShift.Tests -c Release --no-build --no-restore -f net10.0 \
            --filter "FullyQualifiedName~ChunkShift.Tests.Fuzzing"
          python3 tools/conformance/csm/decode.py --compare "$CHUNKSHIFT_FUZZ_DUMP"

      # The independent CSP decoder needs Python 3.14 (compression.zstd).
      - name: Set up Python 3.14 for the CSP decoder
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Verify the CSP vectors with the independent generator and decoder
        shell: bash
        run: |
          set -euo pipefail
          python -c "import sys; from compression import zstd; print(sys.version, zstd.zstd_version_info)"
          python tools/conformance/csp/generate.py --verify tests/ChunkShift.Patching.Tests/Fixtures/CspV1
          python tools/conformance/csp/forward_apply.py --vectors tests/ChunkShift.Patching.Tests/Fixtures/CspV1

      - name: Extended CSP apply fuzz with differential decoder check
        shell: bash
        env:
          CHUNKSHIFT_FUZZ_ITERATIONS: 2000
          CHUNKSHIFT_FRAME_FUZZ_ITERATIONS: 10000
          CHUNKSHIFT_FUZZ_DUMP: ${{ runner.temp }}/csp-fuzz
        run: |
          set -euo pipefail
          # Fresh seeds per run explore new inputs; any failure prints its seed
          # and iteration, so it replays with CHUNKSHIFT_FUZZ_SEEDS. The offset
          # differs from the CSM step so the two lanes never share a stream.
          base=$(( ${{ github.run_number }} * 16 + 8 ))
          export CHUNKSHIFT_FUZZ_SEEDS="$base,$((base + 1)),$((base + 2)),$((base + 3))"
          echo "fuzz seeds: $CHUNKSHIFT_FUZZ_SEEDS"
          dotnet test tests/ChunkShift.Patching.Tests -c Release --no-build --no-restore \
            --filter "FullyQualifiedName~ChunkShift.Patching.Tests.Fuzzing"
          python tools/conformance/csp/decode.py --compare "$CHUNKSHIFT_FUZZ_DUMP"
          python tools/conformance/csp/forward_apply.py --compare "$CHUNKSHIFT_FUZZ_DUMP"
          # Mutated zstd frames alone: ZstdSharp against the runner's libzstd.
          python tools/conformance/csp/decode.py --compare-frames "$CHUNKSHIFT_FUZZ_DUMP"

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack src/ChunkShift/ChunkShift.csproj -c Release --no-build --no-restore -o artifacts/packages -p:PackageVersion=${PACKAGE_VERSION}
          dotnet pack src/ChunkShift.Patching/ChunkShift.Patching.csproj -c Release --no-build --no-restore -o artifacts/packages -p:PackageVersion=${PACKAGE_VERSION}

      - name: Check package runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package/check_dependencies.py "artifacts/packages/ChunkShift.${PACKAGE_VERSION}.nupkg"
          python3 tools/package/check_dependencies.py "artifacts/packages/ChunkShift.Patching.${PACKAGE_VERSION}.nupkg"

      - name: Package smoke (JIT)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/package-smoke
          dotnet run --project tests/ChunkShift.PackageSmoke/ChunkShift.PackageSmoke.csproj -c Release \
            -p:ChunkShiftPackageVersion="${PACKAGE_VERSION}" \
            -p:RestoreAdditionalProjectSources="${GITHUB_WORKSPACE}/artifacts/packages" \
            -- --evidence "artifacts/package-smoke/jit-${{ matrix.rid }}.txt"

      - name: NativeAOT package-consumer publish
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish tests/ChunkShift.PackageSmoke/ChunkShift.PackageSmoke.csproj -c Release \
            -r "${{ matrix.rid }}" --self-contained true -p:PublishAot=true -p:PublishTrimmed=true \
            -p:ChunkShiftPackageVersion="${PACKAGE_VERSION}" \
            -p:RestoreAdditionalProjectSources="${GITHUB_WORKSPACE}/artifacts/packages" \
            -o artifacts/aot-publish

      - name: Run NativeAOT smoke and compare with JIT
        shell: bash
        run: |
          set -euo pipefail
          ./artifacts/aot-publish/ChunkShift.PackageSmoke \
            --evidence "artifacts/package-smoke/aot-${{ matrix.rid }}.txt"
          diff -u \
            "artifacts/package-smoke/jit-${{ matrix.rid }}.txt" \
            "artifacts/package-smoke/aot-${{ matrix.rid }}.txt"

      - name: Larger-than-memory source in an isolated, memory-limited process
        shell: bash
        run: |
          set -euo pipefail
          smoke="${GITHUB_WORKSPACE}/artifacts/aot-publish/ChunkShift.PackageSmoke"
          source="${RUNNER_TEMP}/large-source.bin"

          # 4 GiB file, 128 MiB cgroup limit, no swap: materializing the source
          # (or anything proportional to it) gets the process OOM-killed.
          "$smoke" --generate "$source" 4294967296
          sudo systemd-run --scope --quiet \
            -p MemoryMax=128M -p MemorySwapMax=0 \
            --uid="$(id -u)" --gid="$(id -g)" \
            "$smoke" --large-source "$source" --manifest "${RUNNER_TEMP}/large-source.csm" \
            --evidence "${GITHUB_WORKSPACE}/artifacts/package-smoke/large-${{ matrix.rid }}.txt"
          rm -f "$source"

      - name: Patching package smoke (JIT)
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tests/ChunkShift.Patching.PackageSmoke/ChunkShift.Patching.PackageSmoke.csproj -c Release \
            -p:ChunkShiftPackageVersion="${PACKAGE_VERSION}" \
            -p:RestoreAdditionalProjectSources="${GITHUB_WORKSPACE}/artifacts/packages" \
            -- --evidence "artifacts/package-smoke/patching-jit-${{ matrix.rid }}.txt"

      - name: Patching NativeAOT package-consumer publish
        shell: bash
        run: |
          set -euo pipefail
          # TreatWarningsAsErrors is repository-wide, so a trim or AOT warning
          # fails this publish instead of passing quietly.
          dotnet publish tests/ChunkShift.Patching.PackageSmoke/ChunkShift.Patching.PackageSmoke.csproj -c Release \
            -r "${{ matrix.rid }}" --self-contained true -p:PublishAot=true -p:PublishTrimmed=true \
            -p:ChunkShiftPackageVersion="${PACKAGE_VERSION}" \
            -p:RestoreAdditionalProjectSources="${GITHUB_WORKSPACE}/artifacts/packages" \
            -o artifacts/aot-publish-patching

      - name: Run Patching NativeAOT smoke and compare with JIT
        shell: bash
        run: |
          set -euo pipefail
          ./artifacts/aot-publish-patching/ChunkShift.Patching.PackageSmoke \
            --evidence "artifacts/package-smoke/patching-aot-${{ matrix.rid }}.txt"
          diff -u \
            "artifacts/package-smoke/patching-jit-${{ matrix.rid }}.txt" \
            "artifacts/package-smoke/patching-aot-${{ matrix.rid }}.txt"

      - name: Upload package-smoke evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-smoke-${{ matrix.rid }}
          path: artifacts/package-smoke/
          if-no-files-found: error
          retention-days: 30

  determinism:
    name: cross-arch-determinism
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download package-smoke evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-smoke-*
          path: artifacts/package-smoke
          merge-multiple: true

      - name: Compare x64 and ARM64 identities
        shell: bash
        run: |
          set -euo pipefail
          # NativeAOT x64 vs NativeAOT ARM64; JIT vs AOT was compared per architecture.
          diff -u \
            artifacts/package-smoke/aot-linux-x64.txt \
            artifacts/package-smoke/aot-linux-arm64.txt
          diff -u \
            artifacts/package-smoke/large-linux-x64.txt \
            artifacts/package-smoke/large-linux-arm64.txt
          diff -u \
            artifacts/package-smoke/patching-aot-linux-x64.txt \
            artifacts/package-smoke/patching-aot-linux-arm64.txt
          cat artifacts/package-smoke/aot-linux-x64.txt \
            artifacts/package-smoke/large-linux-x64.txt \
            artifacts/package-smoke/patching-aot-linux-x64.txt
