name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  conventional-title:
    name: conventional-title
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate title
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?(!)?:[[:space:]][^[:space:]].+'
          if [[ ! "${PR_TITLE}" =~ ${pattern} ]]; then
            echo "PR title must follow Conventional Commits." >&2
            echo "Example: feat(core): add deterministic scanner" >&2
            echo "Breaking pre-1.0 example: feat(core)!: change ownership contract" >&2
            exit 1
          fi
