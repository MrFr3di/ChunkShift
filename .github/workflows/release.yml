name: Release

# Controlled release of the ChunkShift and ChunkShift.Patching packages
# (docs/RELEASES.md §6). Both packages ship together with one version.
#
#   validate        builds, tests, packs, inspects and consumes the exact
#                   packages (JIT and NativeAOT); read-only token.
#   publish         only with publish_nuget: verifies checksums, attests
#                   provenance and pushes the validated files through NuGet
#                   Trusted Publishing. Runs no repository code and is the
#                   only job with id-token: write; gated by the release
#                   environment.
#   github-release  creates the immutable v<version> tag on the built commit
#                   and publishes the GitHub Release with the same files and
#                   the CHANGELOG.md section as notes; the only job with
#                   contents: write. Re-running it after a partial failure
#                   resumes from the existing tag or draft.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact 0.1.Z SemVer package version without build metadata (for example 0.1.0 or 0.1.1-rc.1)"
        required: true
        type: string
      publish_nuget:
        description: "Publish to nuget.org, then create the tag and publish the GitHub Release"
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  validate:
    name: validate-package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Require main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release workflow must be dispatched from main." >&2
            exit 1
          fi

      - name: Validate requested version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys

          version = os.environ["VERSION"]
          # Strict SemVer 2.0 shape for the current 0.1.Z train. Build metadata
          # is disallowed because NuGet normalizes it away for package identity
          # and the workflow must have one canonical version string.
          match = re.fullmatch(
              r"0\.1\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?",
              version,
          )
          if match is None:
              sys.exit(
                  "Version must be a canonical 0.1.Z SemVer value "
                  "(for example 0.1.0 or 0.1.1-rc.1), without build metadata."
              )

          prerelease = match.group(2)
          if prerelease:
              for identifier in prerelease.split("."):
                  if identifier.isdigit() and len(identifier) > 1 and identifier[0] == "0":
                      sys.exit(
                          f"Numeric pre-release identifier '{identifier}' must not contain leading zeroes."
                      )
          PY

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The requested version must be the one main declares: its X.Y.Z core
      # equals VersionPrefix of both packages, so every release first bumps
      # VersionPrefix in a reviewed PR. A version that is not higher than
      # everything either package has on nuget.org, or whose tag already
      # exists, is refused before any build.
      - name: Check version against VersionPrefix, nuget.org and tags
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          for project in src/ChunkShift/ChunkShift.csproj src/ChunkShift.Patching/ChunkShift.Patching.csproj; do
            prefix=$(dotnet msbuild "${project}" -getProperty:VersionPrefix | tr -d '[:space:]')
            if [[ "${VERSION%%-*}" != "${prefix}" ]]; then
              echo "Version ${VERSION} does not match VersionPrefix ${prefix} of ${project} on this commit; bump VersionPrefix in a PR first." >&2
              exit 1
            fi
          done

          for id in chunkshift chunkshift.patching; do
            # nuget.org flat container: 404 means the package id has no
            # versions yet; any other non-200 answer is an error, not "not
            # published".
            status=$(curl -sS -o "nuget-versions-${id}.json" -w '%{http_code}' \
              "https://api.nuget.org/v3-flatcontainer/${id}/index.json")
            if [[ "${status}" == 404 ]]; then
              echo '{"versions": []}' > "nuget-versions-${id}.json"
            elif [[ "${status}" != 200 ]]; then
              echo "nuget.org version lookup for ${id} failed with HTTP ${status}." >&2
              exit 1
            fi
          done

          # Refuse any version that is not strictly higher, by SemVer 2.0
          # precedence, than every version of either package already on
          # nuget.org: that covers reuse (equal), lower cores, lower
          # pre-releases (rc.2 < rc.10, beta < rc.1) and a pre-release after
          # its own stable release.
          python3 - <<'PY'
          import json, os, sys

          def precedence(version):
              core, _, pre = version.split("+", 1)[0].partition("-")
              numbers = tuple(int(part) for part in core.split("."))
              if not pre:
                  return (numbers, 1, ())
              return (numbers, 0, tuple(
                  (0, int(part), "") if part.isdigit() else (1, 0, part)
                  for part in pre.split(".")))

          requested = os.environ["VERSION"]
          for package_id, name in (("chunkshift", "ChunkShift"), ("chunkshift.patching", "ChunkShift.Patching")):
              for version in json.load(open(f"nuget-versions-{package_id}.json"))["versions"]:
                  # NuGet compares pre-release labels case-insensitively.
                  if precedence(version.lower()) >= precedence(requested.lower()):
                      sys.exit(f"{name} {requested} is not higher than published {version}; published versions are never reused.")
          PY
          rm nuget-versions-*.json

          if [[ -n "$(git ls-remote --tags origin "refs/tags/v${VERSION}")" ]]; then
            echo "Tag v${VERSION} already exists; release tags are never moved or reused." >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore ChunkShift.slnx

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          dotnet build ChunkShift.slnx -c Release --no-restore
          dotnet test ChunkShift.slnx -c Release --no-build --no-restore

      - name: Verify the FastCDC and CSM vectors with the independent tools
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/conformance/fastcdc_reference.py --verify
          python3 tools/conformance/csm/generate.py --verify tests/ChunkShift.Tests/Fixtures/CsmV1

      # The independent CSP decoder needs Python 3.14 (compression.zstd).
      - name: Set up Python 3.14 for the CSP decoder
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Verify the CSP vectors with the independent tools
        shell: bash
        run: |
          set -euo pipefail
          python tools/conformance/csp/generate.py --verify tests/ChunkShift.Patching.Tests/Fixtures/CspV1
          python tools/conformance/csp/forward_apply.py --vectors tests/ChunkShift.Patching.Tests/Fixtures/CspV1

      - name: Pack exact release artifacts
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          dotnet pack src/ChunkShift/ChunkShift.csproj -c Release --no-build --no-restore -o artifacts/packages -p:PackageVersion="${VERSION}"
          dotnet pack src/ChunkShift.Patching/ChunkShift.Patching.csproj -c Release --no-build --no-restore -o artifacts/packages -p:PackageVersion="${VERSION}"

      - name: Check package runtime dependencies
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 tools/package/check_dependencies.py "artifacts/packages/ChunkShift.${VERSION}.nupkg"
          python3 tools/package/check_dependencies.py "artifacts/packages/ChunkShift.Patching.${VERSION}.nupkg"

      - name: Inspect package metadata and contents
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          import zipfile

          version = os.environ["VERSION"]
          sha = os.environ["GITHUB_SHA"]
          errors = []

          packages = {
              "ChunkShift": ("net8.0", "net10.0"),
              "ChunkShift.Patching": ("net10.0",),
          }

          for package_id, tfms in packages.items():
              def check(condition, message, package_id=package_id):
                  if not condition:
                      errors.append(f"{package_id}: {message}")

              with zipfile.ZipFile(f"artifacts/packages/{package_id}.{version}.nupkg") as package:
                  names = set(package.namelist())
                  nuspec = ET.fromstring(package.read(f"{package_id}.nuspec"))
              ns = {"n": nuspec.tag.split("}")[0].strip("{")}
              meta = nuspec.find("n:metadata", ns)
              text = lambda tag: (meta.findtext(f"n:{tag}", default="", namespaces=ns) or "").strip()
              repository = meta.find("n:repository", ns)

              check(text("id") == package_id, f"id is {text('id')!r}")
              check(text("version") == version, f"version is {text('version')!r}")
              check(text("license") == "MIT", f"license is {text('license')!r}")
              check(text("readme") == "README.md" and "README.md" in names, "README.md is missing")
              check(text("icon") == "icon.png" and "icon.png" in names, "icon.png is missing")
              check(text("projectUrl") == "https://github.com/MrFr3di/ChunkShift", f"projectUrl is {text('projectUrl')!r}")
              check(repository is not None and repository.get("url") == "https://github.com/MrFr3di/ChunkShift",
                    "repository url does not point to MrFr3di/ChunkShift")
              check(repository is not None and repository.get("commit") == sha,
                    f"repository commit is {repository.get('commit') if repository is not None else None!r}, expected {sha}")
              for tfm in tfms:
                  for suffix in ("dll", "xml"):
                      check(f"lib/{tfm}/{package_id}.{suffix}" in names, f"lib/{tfm}/{package_id}.{suffix} is missing")

              with zipfile.ZipFile(f"artifacts/packages/{package_id}.{version}.snupkg") as symbols:
                  for tfm in tfms:
                      check(f"lib/{tfm}/{package_id}.pdb" in symbols.namelist(), f"symbols for {tfm} are missing")

          if errors:
              sys.exit("package inspection failed:\n  " + "\n  ".join(errors))
          print(f"ChunkShift and ChunkShift.Patching {version} package metadata and contents OK (commit {sha})")
          PY

      # The release gate runs the same real-path package smoke as CI and the
      # conformance workflow (scanner, manifest create/verify/read, bounded
      # 32 MiB forward-only source) against the exact package, under JIT and
      # as a trimmed NativeAOT consumer, and requires identical output.
      - name: Consume exact package (JIT and NativeAOT)
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/package-smoke
          dotnet run --project tests/ChunkShift.PackageSmoke/ChunkShift.PackageSmoke.csproj -c Release \
            -p:ChunkShiftPackageVersion="${VERSION}" \
            -p:RestoreAdditionalProjectSources="${GITHUB_WORKSPACE}/artifacts/packages" \
            -- --evidence artifacts/package-smoke/release-jit-linux-x64.txt
          dotnet publish tests/ChunkShift.PackageSmoke/ChunkShift.PackageSmoke.csproj -c Release \
            -r linux-x64 --self-contained true -p:PublishAot=true -p:PublishTrimmed=true \
            -p:ChunkShiftPackageVersion="${VERSION}" \
            -p:RestoreAdditionalProjectSources="${GITHUB_WORKSPACE}/artifacts/packages" \
            -o artifacts/release-consumer-publish
          ./artifacts/release-consumer-publish/ChunkShift.PackageSmoke \
            --evidence artifacts/package-smoke/release-aot-linux-x64.txt
          diff -u artifacts/package-smoke/release-jit-linux-x64.txt artifacts/package-smoke/release-aot-linux-x64.txt

      # The Patching consumer (plan, create, apply, in-place update and the
      # public failure paths) against both exact packages, under JIT and as a
      # trimmed NativeAOT consumer, with identical output.
      - name: Consume exact Patching package (JIT and NativeAOT)
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          dotnet run --project tests/ChunkShift.Patching.PackageSmoke/ChunkShift.Patching.PackageSmoke.csproj -c Release \
            -p:ChunkShiftPackageVersion="${VERSION}" \
            -p:RestoreAdditionalProjectSources="${GITHUB_WORKSPACE}/artifacts/packages" \
            -- --evidence artifacts/package-smoke/release-patching-jit-linux-x64.txt
          dotnet publish tests/ChunkShift.Patching.PackageSmoke/ChunkShift.Patching.PackageSmoke.csproj -c Release \
            -r linux-x64 --self-contained true -p:PublishAot=true -p:PublishTrimmed=true \
            -p:ChunkShiftPackageVersion="${VERSION}" \
            -p:RestoreAdditionalProjectSources="${GITHUB_WORKSPACE}/artifacts/packages" \
            -o artifacts/release-patching-consumer-publish
          ./artifacts/release-patching-consumer-publish/ChunkShift.Patching.PackageSmoke \
            --evidence artifacts/package-smoke/release-patching-aot-linux-x64.txt
          diff -u artifacts/package-smoke/release-patching-jit-linux-x64.txt artifacts/package-smoke/release-patching-aot-linux-x64.txt

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/packages
          sha256sum -- *.nupkg *.snupkg > SHA256SUMS
          cat SHA256SUMS

      # Release notes come from the curated CHANGELOG.md section, not from
      # generated commit lists. A version without a section is refused here,
      # before anything is published.
      - name: Prepare release notes from CHANGELOG.md
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          version = os.environ["VERSION"]
          section = None
          for line in Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines():
              if line.startswith("## ["):
                  if section is not None:
                      break
                  if line.startswith(f"## [{version}]"):
                      section = []
                  continue
              if section is not None:
                  section.append(line)

          # Stop before link reference definitions such as "[0.1.0]: https://...".
          notes = "\n".join(
              line for line in (section or []) if not (line.startswith("[") and "]: " in line)
          ).strip()
          if not notes:
              sys.exit(f"CHANGELOG.md has no non-empty [{version}] section; add it in the release PR.")
          Path("artifacts/packages/RELEASE_NOTES.md").write_text(notes + "\n", encoding="utf-8")
          print(notes)
          PY

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chunkshift-${{ inputs.version }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/SHA256SUMS
            artifacts/packages/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish-nuget
    needs: validate
    if: ${{ inputs.publish_nuget }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chunkshift-${{ inputs.version }}
          path: artifacts/packages

      - name: Verify checksums
        working-directory: artifacts/packages
        run: sha256sum --check --strict SHA256SUMS

      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg

      - name: NuGet trusted-publishing login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Core first: ChunkShift.Patching depends on ChunkShift of the same
          # version. validate refused any version either package already had
          # on nuget.org, so a duplicate here can only come from an earlier
          # attempt of this run; --skip-duplicate lets a re-run of this job
          # finish a partial publish. Symbols go separately and may be
          # retried the same way.
          for id in ChunkShift ChunkShift.Patching; do
            dotnet nuget push "artifacts/packages/${id}.${VERSION}.nupkg" --no-symbols --skip-duplicate \
              --api-key "${NUGET_API_KEY}" \
              --source "https://api.nuget.org/v3/index.json"
          done
          for id in ChunkShift ChunkShift.Patching; do
            dotnet nuget push "artifacts/packages/${id}.${VERSION}.snupkg" --skip-duplicate \
              --api-key "${NUGET_API_KEY}" \
              --source "https://api.nuget.org/v3/index.json"
          done

  github-release:
    name: github-release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chunkshift-${{ inputs.version }}
          path: artifacts/packages

      - name: Create v${{ inputs.version }} tag and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"

          # Tag the exact commit the published packages were built from. A
          # re-run accepts a tag that already points to that commit; a tag on
          # any other commit is never moved. matching-refs answers an empty
          # list for a missing tag, so a failed lookup stops the job instead
          # of being mistaken for an existing tag (the error body of a 404 on
          # git/ref goes to stdout).
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${tag}" \
            --jq ".[] | select(.ref == \"refs/tags/${tag}\") | .object.sha")
          if [[ -z "${existing}" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/git/refs"               -f ref="refs/tags/${tag}"               -f sha="${GITHUB_SHA}" > /dev/null
          elif [[ "${existing}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${tag} already points to ${existing}, not ${GITHUB_SHA}; it is never moved." >&2
            exit 1
          fi

          assets=(artifacts/packages/*.nupkg artifacts/packages/*.snupkg artifacts/packages/SHA256SUMS)
          state=$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft -q .isDraft 2> /dev/null || echo missing)
          case "${state}" in
            missing)
              flags=()
              if [[ "${VERSION}" == *-* ]]; then flags=(--prerelease --latest=false); else flags=(--latest); fi
              # Draft first: with immutable releases, assets must be attached
              # before publication freezes the tag and the assets.
              gh release create "${tag}"                 --repo "${GITHUB_REPOSITORY}"                 --verify-tag                 --draft                 "${flags[@]}"                 --title "ChunkShift ${VERSION}"                 --notes-file artifacts/packages/RELEASE_NOTES.md                 "${assets[@]}"
              ;;
            true)
              # A draft left by an earlier failed run: attach the same validated files.
              gh release upload "${tag}" --repo "${GITHUB_REPOSITORY}" --clobber "${assets[@]}"
              ;;
            false)
              echo "Release ${tag} is already published."
              exit 0
              ;;
          esac

          gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --draft=false
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json url,isDraft,isImmutable -q .
