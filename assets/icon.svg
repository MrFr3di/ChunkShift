<svg xmlns="http://www.w3.org/2000/svg" width="942" height="942" viewBox="-40 -76 942 942">
  <title>ChunkShift</title>
  <defs>
    <linearGradient id="grid" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="790" y2="790">
      <stop offset="0" stop-color="#00CCFA"/>
      <stop offset="0.25" stop-color="#0495FB"/>
      <stop offset="0.5" stop-color="#1A61FA"/>
      <stop offset="0.75" stop-color="#5528FC"/>
      <stop offset="1" stop-color="#7414FC"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="moved" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B46AFC"/>
      <stop offset="1" stop-color="#6A16FC"/>
