      <rect x="0" y="0" width="250" height="250" rx="48"/>
      <rect x="270" y="0" width="250" height="250" rx="48"/>
      <rect x="540" y="0" width="250" height="250" rx="48"/>
      <rect x="0" y="270" width="250" height="250" rx="48"/>
      <rect x="270" y="270" width="250" height="250" rx="48"/>
      <rect x="0" y="540" width="250" height="250" rx="48"/>
      <rect x="270" y="540" width="250" height="250" rx="48"/>
      <rect x="540" y="540" width="250" height="250" rx="48"/>
